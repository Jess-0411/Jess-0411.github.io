<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目管理 V1.2 本地打开说明</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#17243c;font:15px/1.8 "Microsoft YaHei","PingFang SC",Arial,sans-serif}.page{width:min(760px,calc(100% - 32px));margin:64px auto;background:#fff;border:1px solid #dfe7f1;border-radius:14px;padding:34px 40px;box-shadow:0 16px 42px rgba(36,63,105,.1)}h1{margin:0 0 12px;font-size:26px}p,li{color:#54627a}.notice{margin:22px 0;padding:16px 18px;border-radius:10px;background:#eef5ff;border-left:4px solid #1769e8}.file{display:inline-block;margin:4px 0;padding:6px 12px;border-radius:7px;background:#17243c;color:#fff;font-family:Consolas,"Microsoft YaHei",sans-serif}.tip{margin-top:24px;padding-top:18px;border-top:1px solid #e7edf4;font-size:13px;color:#78859a}
  </style>
</head>
<body>
  <main class="page">
    <h1>项目管理 V1.2 本地打开说明</h1>
    <p>该交付物是包含 JavaScript、CSS 和多页面路由的静态站点，不能直接双击内部 <code>index.html</code> 运行。</p>
    <div class="notice">
      <strong>正确打开方式</strong>
      <ol>
        <li>回到当前发布目录根目录。</li>
        <li>双击 <span class="file">打开项目管理V1.2.cmd</span>。</li>
        <li>保持弹出的命令窗口开启，系统会自动在默认浏览器中打开。</li>
      </ol>
    </div>
    <p>关闭预览时，在命令窗口中按 <strong>Ctrl+C</strong>，或直接关闭命令窗口。</p>
    <p class="tip">本地预览只监听 127.0.0.1，不向局域网或互联网开放，也不会启动后端或数据库。</p>
  </main>
</body>
</html>
