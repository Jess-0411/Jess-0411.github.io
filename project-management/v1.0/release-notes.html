<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>项目管理 V1.0 版本说明</title><style>
    :root{color-scheme:light;--blue:#1769e8;--blue-dark:#0e55bd;--blue-soft:#edf5ff;--text:#17243c;--muted:#6f7e96;--line:#dfe7f1;--bg:#f3f7fc;--card:#fff;--green:#15855d;--shadow:0 18px 50px rgba(36,63,105,.11)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);background:var(--bg)}
    body:before{content:"";position:fixed;z-index:0;pointer-events:none;inset:0 0 auto;height:310px;background:linear-gradient(135deg,#0d5bd1,#2e83ef)}
    .page{position:relative;z-index:1;width:min(1120px,calc(100% - 40px));margin:0 auto;padding:52px 0 62px}.hero{color:#fff;margin-bottom:34px}.eyebrow{font-size:14px;letter-spacing:.12em;opacity:.84}.hero h1{margin:12px 0 10px;font-size:34px;line-height:1.35}.hero p{margin:0;opacity:.9;line-height:1.8}
    .panel{background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:30px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}.panel-head h2{margin:0 0 7px;font-size:22px}.panel-head p{margin:0;color:var(--muted);font-size:14px}.isolation{padding:10px 14px;border-radius:8px;background:var(--blue-soft);color:#345b8e;font-size:13px;white-space:nowrap}
    .versions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.version-card{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--card);display:flex;flex-direction:column;min-height:318px}.version-card.current{border-color:#97bff5;box-shadow:0 0 0 3px #edf5ff}.version-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.version-top h3{margin:0;font-size:25px}.status{height:28px;padding:0 10px;border-radius:14px;display:inline-flex;align-items:center;background:#edf1f6;color:#647086;font-size:12px}.status.current{background:#e9f8f2;color:var(--green)}.date{color:var(--muted);font-size:13px;margin-top:9px}.summary{margin:18px 0 0;line-height:1.75;color:#46546d}.changes{margin:13px 0 24px;padding-left:20px;color:#637189;font-size:13px;line-height:1.8}.actions{display:flex;align-items:center;gap:12px;margin-top:auto}.enter{height:40px;padding:0 18px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600}.enter:hover{background:var(--blue-dark)}.notes{color:var(--blue);text-decoration:none;font-size:13px}.notes:hover{text-decoration:underline}
    .foot{margin-top:20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.error{padding:40px;text-align:center;color:#b5474d;border:1px dashed #e0a6aa;border-radius:10px;background:#fff6f6}
    @media(max-width:760px){.page{width:min(100% - 24px,1120px);padding-top:30px}.hero h1{font-size:27px}.panel{padding:20px}.panel-head{align-items:flex-start;flex-direction:column}.isolation{white-space:normal}.versions{grid-template-columns:1fr}.version-card{min-height:auto}}
  </style></head><body><main class="page"><header class="hero"><h1>项目管理 V1.0</h1><p>v1.0.5</p></header><section class="panel"><h2>版本说明</h2><p>项目全过程管理交互原型，延期与变更审批同步当前项目信息。</p><ul><li>延期最终通过后更新结束日期，严格晚于当前有效结束日期</li><li>变更统一项目名称、预算（万元）、周期，最终通过后自动回写</li><li>学校端与教育局端详情按最新版新增字段展示当前主记录</li><li>保留结项、归档、历史事项及浏览器演示数据</li></ul><p>入口拆分日期：2026-11-06。保留本版本业务功能，单独维护与发布。</p><a class="enter" href="../">返回版本选择</a></section></main></body></html>
